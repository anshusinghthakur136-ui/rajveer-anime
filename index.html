
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RAJVEER ANIME</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#080914;color:white;font-family:Arial}
header{padding:22px;background:#17152b;text-align:center}
header h1{color:#d66bff;margin:0}
nav{padding:15px;text-align:center;background:#111326}
nav a{color:white;text-decoration:none;margin:12px}
.hero{text-align:center;padding:55px 15px;background:linear-gradient(130deg,#3d125d,#10172e)}
.hero h2{font-size:32px;color:#f18aff}
.search{text-align:center;padding:22px}
input{padding:14px;width:85%;max-width:420px;border:0;border-radius:10px}
h2{text-align:center;color:#d66bff}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:15px;padding:15px}
.card{background:#191b30;border-radius:12px;padding:12px;text-align:center}
.card img{width:100%;height:190px;object-fit:cover;border-radius:9px}
.card h3{margin-bottom:5px}
button{background:#d34cff;color:white;border:0;border-radius:8px;padding:11px}
footer{text-align:center;padding:25px;background:#17152b;color:#ccc}
</style>
</head>
<body>
<header>
<h1>RAJVEER ANIME</h1>
<p>WELCOME TO MY ANIME WORLD</p>
</header>
<nav>
<a href="#">Home</a>
<a href="#anime">Anime</a>
<a href="#about">About</a>
</nav>
<section class="hero">
<h2>ANIME WORLD</h2>
<p>Discover Your Favourite Anime!</p>
</section>
<div class="search">
<input id="search" placeholder="Search Anime..." oninput="findAnime()">
</div>
<h2 id="anime">POPULAR ANIME</h2>
<div class="cards">
<div class="card">
<img src="https://placehold.co/300x400/24133c/ffffff?text=Naruto" alt="Naruto">
<h3>Naruto</h3><p>Adventure</p>
</div>
<div class="card">
<img src="https://placehold.co/300x400/24133c/ffffff?text=One+Piece" alt="One Piece">
<h3>One Piece</h3><p>Adventure</p>
</div>
<div class="card">
<img src="https://placehold.co/300x400/24133c/ffffff?text=Demon+Slayer" alt="Demon Slayer">
<h3>Demon Slayer</h3><p>Action</p>
</div>
<div class="card">
<img src="https://placehold.co/300x400/24133c/ffffff?text=Jujutsu+Kaisen" alt="Jujutsu Kaisen">
<h3>Jujutsu Kaisen</h3><p>Fantasy</p>
</div>
</div>
<section id="about" style="text-align:center;padding:30px">
<h2>ABOUT US</h2>
<p>Created by Rajveer ❤️</p>
</section>
<footer>© 2026 RAJVEER ANIME</footer>
<script>
function findAnime(){
let q=document.getElementById('search').value.toLowerCase();
document.querySelectorAll('.card').forEach(c=>{
c.style.display=c.innerText.toLowerCase().includes(q)?'block':'none';
});
}
</script>
</body>
</html>
